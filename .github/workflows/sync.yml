name: Revisar disponibilidad del proveedor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Revisar productos
        run: node sync/check-stock.mjs
      - name: Guardar cambios
        run: |
          git add products.json data/supplier-catalog.json
          if ! git diff --cached --quiet; then
            git config user.name "revisor-stock"
            git config user.email "revisor-stock@users.noreply.github.com"
            git commit -m "Actualizar disponibilidad"
            git pull --rebase
            git push
          fi
